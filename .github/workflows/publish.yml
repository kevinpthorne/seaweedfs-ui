name: Build & Publish (Nix Executable -> Docker Image -> Helm Chart)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  nix-build-and-publish:
    name: Nix Build & Publish Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Nix Store Cache (Magic Nix Cache)
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Optional Cachix Binary Cache
        if: ${{ vars.CACHIX_CACHE_NAME != '' }}
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Compute release metadata
        id: meta
        run: |
          IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.1.0-${SHORT_SHA}"
          fi
          echo "image_repo=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
          echo "owner_lower=${OWNER_LOWER}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # ========================================================================
      # 1. Nix Derivation 1: Build & Test the Go Executable (seaweedfs-ui)
      # ========================================================================
      - name: "1. Build Executable via Nix (.#seaweedfs-ui)"
        run: |
          nix build .#seaweedfs-ui --print-build-logs --out-link result-bin
          ./result-bin/bin/seaweedfs-ui --version

      # ========================================================================
      # 2. Nix Derivation 2: Build the Docker/OCI Image (.#docker-image)
      # ========================================================================
      - name: "2. Build Container Image via Nix (.#docker-image)"
        run: |
          nix build .#docker-image --print-build-logs --out-link result-image
          ls -lh result-image

      - name: Load and Verify Nix Container Image in Docker
        run: |
          LOADED_OUT=$(docker load < result-image)
          echo "$LOADED_OUT"
          LOADED_IMAGE=$(echo "$LOADED_OUT" | sed -n 's/^Loaded image: //p' | tail -n1)
          echo "LOADED_IMAGE=${LOADED_IMAGE}" >> "$GITHUB_ENV"
          docker run --rm "${LOADED_IMAGE}" --version

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Push Docker Image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          TARGET_IMAGE="${{ env.REGISTRY }}/${{ steps.meta.outputs.image_repo }}"
          docker tag "${LOADED_IMAGE}" "${TARGET_IMAGE}:${{ steps.meta.outputs.version }}"
          docker tag "${LOADED_IMAGE}" "${TARGET_IMAGE}:sha-${{ steps.meta.outputs.short_sha }}"
          docker push "${TARGET_IMAGE}:${{ steps.meta.outputs.version }}"
          docker push "${TARGET_IMAGE}:sha-${{ steps.meta.outputs.short_sha }}"

          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master" || "${{ github.ref }}" == refs/tags/v* ]]; then
            docker tag "${LOADED_IMAGE}" "${TARGET_IMAGE}:latest"
            docker push "${TARGET_IMAGE}:latest"
          fi

      # ========================================================================
      # 3. Nix Derivation 3: Build & Package the Helm Chart (.#helm-chart)
      # ========================================================================
      - name: "3. Build & Lint Helm Chart via Nix (.#helm-chart)"
        run: |
          nix build .#helm-chart --print-build-logs --out-link result-chart
          ls -la result-chart/
          cat result-chart/release-metadata.json

      - name: Upload Packaged Helm Chart Artifact
        uses: actions/upload-artifact@v4
        with:
          name: seaweedfs-ui-helm-chart
          path: |
            result-chart/seaweedfs-ui-*.tgz
            result-chart/release-metadata.json

      - name: Push Packaged Helm Chart to GHCR OCI Registry
        if: github.event_name != 'pull_request'
        run: |
          CHART_TGZ=$(ls result-chart/seaweedfs-ui-*.tgz | head -n1)
          echo "${{ secrets.GITHUB_TOKEN }}" | nix run nixpkgs#kubernetes-helm -- registry login "${{ env.REGISTRY }}" \
            --username "${{ github.actor }}" \
            --password-stdin
          nix run nixpkgs#kubernetes-helm -- push "${CHART_TGZ}" \
            "oci://${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/charts"
