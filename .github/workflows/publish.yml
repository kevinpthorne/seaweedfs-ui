name: Build & Publish (Nix Executable -> Multi-Arch Docker Images -> Helm Chart)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  nix-build-and-publish:
    name: Nix Multi-Arch Build & Publish Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Nix Store Cache (Magic Nix Cache)
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Optional Cachix Binary Cache
        if: ${{ vars.CACHIX_CACHE_NAME != '' }}
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Compute release metadata
        id: meta
        run: |
          IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.1.0-${SHORT_SHA}"
          fi
          echo "image_repo=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
          echo "owner_lower=${OWNER_LOWER}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # ========================================================================
      # 1. Nix Derivation 1: Build & Test Executables (native + amd64 + arm64)
      # ========================================================================
      - name: "1. Build Executables via Nix (.#seaweedfs-ui, amd64, arm64)"
        run: |
          nix build .#seaweedfs-ui --print-build-logs --out-link result-bin
          ./result-bin/bin/seaweedfs-ui --version
          nix build .#seaweedfs-ui-linux-amd64 --print-build-logs --out-link result-bin-amd64
          nix build .#seaweedfs-ui-linux-arm64 --print-build-logs --out-link result-bin-arm64

      # ========================================================================
      # 2. Nix Derivation 2: Build Multi-Arch Container Images (amd64 & arm64)
      # ========================================================================
      - name: "2. Build Multi-Arch Container Images via Nix (.#docker-image-amd64 & .#docker-image-arm64)"
        run: |
          nix build .#docker-image-amd64 --print-build-logs --out-link result-image-amd64
          nix build .#docker-image-arm64 --print-build-logs --out-link result-image-arm64
          ls -lh result-image-amd64 result-image-arm64

      - name: Smoke Test Native (amd64) Container Image in Docker
        run: |
          LOADED_OUT=$(docker load < result-image-amd64)
          echo "$LOADED_OUT"
          LOADED_IMAGE=$(echo "$LOADED_OUT" | sed -n 's/^Loaded image: //p' | tail -n1)
          docker run --rm "${LOADED_IMAGE}" --version

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push amd64 & arm64 Images and Create Multi-Arch Manifests on GHCR
        if: github.event_name != 'pull_request'
        run: |
          TARGET_IMAGE="${{ env.REGISTRY }}/${{ steps.meta.outputs.image_repo }}"
          VERSION="${{ steps.meta.outputs.version }}"
          SHORT_SHA="${{ steps.meta.outputs.short_sha }}"

          # Push per-architecture archives directly to GHCR via skopeo
          nix run .#skopeo -- copy --insecure-policy \
            --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            docker-archive:result-image-amd64 \
            "docker://${TARGET_IMAGE}:${VERSION}-amd64"

          nix run .#skopeo -- copy --insecure-policy \
            --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            docker-archive:result-image-arm64 \
            "docker://${TARGET_IMAGE}:${VERSION}-arm64"

          # Create and push multi-arch manifest lists (linux/amd64 + linux/arm64)
          docker buildx imagetools create \
            -t "${TARGET_IMAGE}:${VERSION}" \
            -t "${TARGET_IMAGE}:sha-${SHORT_SHA}" \
            "${TARGET_IMAGE}:${VERSION}-amd64" \
            "${TARGET_IMAGE}:${VERSION}-arm64"

          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master" || "${{ github.ref }}" == refs/tags/v* ]]; then
            docker buildx imagetools create \
              -t "${TARGET_IMAGE}:latest" \
              "${TARGET_IMAGE}:${VERSION}-amd64" \
              "${TARGET_IMAGE}:${VERSION}-arm64"
          fi

      # ========================================================================
      # 3. Nix Derivation 3: Build & Package the Helm Chart (.#helm-chart)
      # ========================================================================
      - name: "3. Build & Lint Helm Chart via Nix (.#helm-chart)"
        run: |
          nix build .#helm-chart --print-build-logs --out-link result-chart
          ls -la result-chart/
          cat result-chart/release-metadata.json

      - name: Upload Packaged Helm Chart Artifact
        uses: actions/upload-artifact@v4
        with:
          name: seaweedfs-ui-helm-chart
          path: |
            result-chart/seaweedfs-ui-*.tgz
            result-chart/release-metadata.json

      - name: Push Packaged Helm Chart to GHCR OCI Registry
        if: github.event_name != 'pull_request'
        run: |
          CHART_TGZ=$(ls result-chart/seaweedfs-ui-*.tgz | head -n1)
          echo "${{ secrets.GITHUB_TOKEN }}" | nix run .#helm -- registry login "${{ env.REGISTRY }}" \
            --username "${{ github.actor }}" \
            --password-stdin
          nix run .#helm -- push "${CHART_TGZ}" \
            "oci://${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/charts"
