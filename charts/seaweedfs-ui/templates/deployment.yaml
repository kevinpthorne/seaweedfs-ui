apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "seaweedfs-ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "seaweedfs-ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "seaweedfs-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "seaweedfs-ui.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "seaweedfs-ui.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "-config"
            - "/etc/seaweedfs-ui/config.yaml"
          env:
            - name: HOME
              value: "/tmp/seaweedfs"
            - name: ALLOW_ADMIN_ACTIONS
              value: {{ .Values.config.allowAdminActions | quote }}
            - name: ENABLE_RAW_SHELL
              value: {{ .Values.config.enableRawShell | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/seaweedfs-ui
              readOnly: true
            - name: tmp-home
              mountPath: /tmp/seaweedfs
            {{- if and .Values.config.tls.enabled .Values.config.tls.existingSecret }}
            - name: tls-certs
              mountPath: /etc/seaweedfs-ui/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "seaweedfs-ui.fullname" . }}
        - name: tmp-home
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        {{- if and .Values.config.tls.enabled .Values.config.tls.existingSecret }}
        - name: tls-certs
          secret:
            secretName: {{ .Values.config.tls.existingSecret }}
            defaultMode: 0400
            {{- if .Values.config.tls.extraCaSecret }}
            optional: false
            {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
